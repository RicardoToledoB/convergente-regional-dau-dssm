# =========================================================
# Convergente DSSM - proxy para API de paciente
# Dominio solicitado: https://convergente.dssm.cl/api/patient/{rut}
# Backend Spring Boot: 127.0.0.1:8086
# =========================================================

# Requiere módulos proxy y proxy_http habilitados.
ProxyPreserveHost On
ProxyPass        /api/patient/ http://127.0.0.1:8086/api/patient/
ProxyPassReverse /api/patient/ http://127.0.0.1:8086/api/patient/

# IMPORTANTE si el vhost tiene fallback Angular mediante RewriteRule:
# agregar antes del rewrite hacia index.html:
# RewriteCond %{REQUEST_URI} !^/api/patient/
